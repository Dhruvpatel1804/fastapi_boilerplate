# PostgreSQL runs outside Docker (local install or remote server).
# Set DATABASE_URL in .env to point at that instance.
#
# Image name and version — single source of truth for CI build/push and server deploy.
# Update repository and tag here only; CI runs: docker compose build && docker compose push

services:
  api:
    image: your-dockerhub-username/fastapi-boilerplate:1.0.0
    build: .
    pull_policy: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "pipenv run alembic upgrade head &&
             pipenv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
